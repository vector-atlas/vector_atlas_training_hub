# Build the site with blogdown + Hugo and deploy it to GitHub Pages.
# Pattern follows the r-lib/actions pkgdown workflow used in idem-lab/traveltime:
# build on every push / PR, deploy the built site to the gh-pages branch on main.
#
# One-off repo setting: Settings -> Pages -> Build and deployment ->
#   Source: "Deploy from a branch", Branch: gh-pages / (root)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: site

permissions: read-all

jobs:
  site:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: site-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::blogdown

      # Hugo version is pinned in .Rprofile (blogdown.hugo.version)
      - name: Install Hugo
        run: blogdown::install_hugo(getOption("blogdown.hugo.version"))
        shell: Rscript {0}

      # Runs Hugo only. Any .Rmd pages are knitted locally and their rendered
      # .md committed (standard blogdown workflow; see AGENTS.md).
      - name: Build site
        run: blogdown::build_site()
        shell: Rscript {0}

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
